<svg xmlns="http://www.w3.org/2000/svg" width="960" height="200" viewBox="0 0 960 200" role="img" aria-labelledby="title desc">
  <title id="title">Ali Etemadfard's core technology stack</title>
  <desc id="desc">Learning reinforcement learning, graph neural networks, computer vision, deep learning, and LLMs. Building with Python, JavaScript, PyTorch, and PyTorch Geometric. Shipping with Git, Docker, FastAPI, and TorchServe.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#2563EB"/><stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <style>
      .chip { fill: #F6F8FA; stroke: #D0D7DE; }
      .label { fill: #526072; }
      .text { fill: #172033; }
      @media (prefers-color-scheme: dark) {
        .chip { fill: #161B22; stroke: #30363D; }
        .label { fill: #8B98A9; }
        .text { fill: #E6EDF3; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="958" height="198" rx="18" fill="none" stroke="url(#edge)" stroke-opacity=".32"/>

  <g font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">
    <text x="30" y="46" class="label" font-size="11" font-weight="700" letter-spacing="1.5">LEARN</text>
    <text x="30" y="103" class="label" font-size="11" font-weight="700" letter-spacing="1.5">BUILD</text>
    <text x="30" y="160" class="label" font-size="11" font-weight="700" letter-spacing="1.5">SHIP</text>

    <g transform="translate(118 20)">
      <rect class="chip" width="142" height="38" rx="19"/><circle cx="20" cy="19" r="4" fill="#2563EB"/>
      <text x="34" y="24" class="text" font-size="14" font-weight="600">RL / Deep RL</text>
    </g>
